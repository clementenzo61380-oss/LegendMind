[project]
name = "legendmind-v3"
version = "3.0.0"
requires-python = ">=3.10"
description = "Bot Discord Legend League (snapshots, alertes, classement)"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [".venv", ".vtest", ".cursor", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
strict = true
packages = ["services", "cogs", "models"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
