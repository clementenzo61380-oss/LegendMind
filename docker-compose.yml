# LegendMind V3 — Postgres + bot (étapes 10–11)
services:
  postgres:
    image: postgres:16-alpine
    container_name: legendmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: legendmind
      POSTGRES_PASSWORD: legendmind
      POSTGRES_DB: legendmind_v3
    volumes:
      - legendmind_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legendmind -d legendmind_v3"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legendmind_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://legendmind:legendmind@postgres:5432/legendmind_v3
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  legendmind_pgdata:
