; Modèles d'export (Projet > Exporter).
; Les builds JOUEUR excluent server/ et data/server_only/ :
; aucun secret ne quitte jamais nos machines.

[preset.0]

name="Client Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="client"
export_filter="all_resources"
include_filter="*.json"
exclude_filter="server/*, data/server_only/*, tests/*"
export_path="build/client_windows/EclatsEther.exe"

[preset.0.options]

[preset.1]

name="Client Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features="client"
export_filter="all_resources"
include_filter="*.json"
exclude_filter="server/*, data/server_only/*, tests/*"
export_path="build/client_linux/EclatsEther.x86_64"

[preset.1.options]

[preset.2]

name="Serveur Linux"
platform="Linux"
runnable=false
dedicated_server=true
custom_features="server"
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*"
export_path="build/server_linux/EclatsEtherServer.x86_64"

[preset.2.options]
